<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" flood-color="#0f172a" flood-opacity="0.12" stdDeviation="6"/>
    </filter>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" flood-color="#0f172a" flood-opacity="0.22" stdDeviation="12"/>
    </filter>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4d6bfe"/>
      <stop offset="55%" stop-color="#3b5bdb"/>
      <stop offset="100%" stop-color="#2f4fd0"/>
    </linearGradient>
    <linearGradient id="chatUser" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4d6bfe"/>
      <stop offset="100%" stop-color="#3b5bdb"/>
    </linearGradient>
  </defs>

  <!-- window -->
  <rect x="8" y="8" width="704" height="464" rx="14" fill="#f8fafc" stroke="#e2e8f0" filter="url(#shadow)"/>
  <path d="M8 50 Q8 22 22 22 H698 Q712 22 712 50" fill="#ffffff" stroke="#e2e8f0"/>
  <path d="M8 50 H712" stroke="#e2e8f0"/>
  <circle cx="34" cy="36" r="6" fill="#f87171"/>
  <circle cx="54" cy="36" r="6" fill="#fbbf24"/>
  <circle cx="74" cy="36" r="6" fill="#34d399"/>
  <rect x="200" y="27" width="320" height="18" rx="9" fill="#eef2f7"/>

  <!-- sidebar -->
  <rect x="22" y="66" width="170" height="392" rx="10" fill="#f1f5f9"/>
  <rect x="36" y="84" width="120" height="9" rx="4.5" fill="#cbd5e1"/>
  <rect x="36" y="112" width="142" height="30" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="50" cy="127" r="5" fill="#4d6bfe"/>
  <rect x="62" y="121" width="100" height="8" rx="4" fill="#94a3b8"/>
  <rect x="36" y="150" width="142" height="30" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="50" cy="165" r="5" fill="#cbd5e1"/>
  <rect x="62" y="159" width="84" height="8" rx="4" fill="#cbd5e1"/>
  <rect x="36" y="188" width="142" height="30" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="50" cy="203" r="5" fill="#cbd5e1"/>
  <rect x="62" y="197" width="70" height="8" rx="4" fill="#cbd5e1"/>

  <!-- chat -->
  <rect x="206" y="80" width="470" height="16" rx="8" fill="#e2e8f0"/>
  <rect x="206" y="112" width="330" height="12" rx="6" fill="#e2e8f0"/>
  <rect x="206" y="132" width="280" height="12" rx="6" fill="#e2e8f0"/>
  <rect x="430" y="176" width="246" height="40" rx="12" fill="url(#chatUser)"/>
  <rect x="452" y="190" width="200" height="8" rx="4" fill="#ffffff" opacity="0.85"/>
  <rect x="206" y="240" width="400" height="56" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="222" y="256" width="360" height="8" rx="4" fill="#cbd5e1"/>
  <rect x="222" y="272" width="300" height="8" rx="4" fill="#cbd5e1"/>
  <rect x="206" y="396" width="470" height="48" rx="24" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="228" y="414" width="200" height="10" rx="5" fill="#cbd5e1"/>

  <!-- floating whale orb -->
  <g transform="translate(560, 388)">
    <circle r="27" fill="none" stroke="#e2e8f0" stroke-width="3"/>
    <circle r="27" fill="none" stroke="#4d6bfe" stroke-width="3" stroke-linecap="round"
            stroke-dasharray="169.65" stroke-dashoffset="10"
            transform="rotate(-90)" filter="url(#shadow)"/>
    <circle r="22" fill="#ffffff" stroke="#dbe4f0" stroke-width="1" filter="url(#shadow)"/>
    <!-- whale -->
    <g transform="translate(-10, -10)" fill="#4d6bfe">
      <path d="M8 2 Q12 -2 17 2 Q22 6 20 11 Q16 16 10 15 Q5 13 6 8 Z"/>
      <path d="M19 7 L25 3 L25 11 Z"/>
      <circle cx="13.5" cy="7.5" r="1.4" fill="#ffffff"/>
    </g>
  </g>

  <!-- anchored card -->
  <g transform="translate(222, 206)" filter="url(#cardShadow)">
    <rect width="316" height="238" rx="16" fill="#ffffff" stroke="#dbe4f0"/>
    <!-- arrow -->
    <path d="M316 118 L326 124 L316 130 Z" fill="#ffffff" stroke="#dbe4f0" stroke-width="1"/>
    <rect x="316" y="122" width="6" height="4" fill="#ffffff"/>

    <!-- header -->
    <g transform="translate(14, 12)">
      <circle cx="8" cy="8" r="8" fill="#4d6bfe" opacity="0.14"/>
      <g transform="translate(4.5, 4.5)" fill="#4d6bfe">
        <path d="M3 0.7 Q4.3 -0.7 6 0.7 Q7.7 2 7 3.8 Q5.7 5.4 3.5 5.1 Q1.7 4.6 2.1 2.8 Z"/>
        <path d="M6.7 2.4 L8.8 1 L8.8 3.8 Z"/>
      </g>
      <text x="26" y="13" font-size="13" font-weight="600" fill="#0f172a">Token 用量与费用</text>
      <text x="292" y="13" font-size="13" fill="#94a3b8">✕</text>
    </g>

    <!-- hero -->
    <g transform="translate(14, 40)">
      <rect width="288" height="92" rx="12" fill="url(#hero)"/>
      <circle cx="34" cy="46" r="44" fill="#ffffff" opacity="0.10"/>
      <!-- ring -->
      <g transform="translate(46, 46)">
        <circle r="26" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.28"/>
        <circle r="26" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"
                stroke-dasharray="163.36" stroke-dashoffset="4"
                transform="rotate(-90)"/>
        <text x="0" y="5" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">99%</text>
      </g>
      <text x="96" y="26" font-size="11" fill="#ffffff" opacity="0.85">账户余额</text>
      <text x="96" y="52" font-size="22" font-weight="700" fill="#ffffff">¥86.42</text>
      <rect x="210" y="20" width="64" height="18" rx="9" fill="#ffffff" opacity="0.2"/>
      <text x="242" y="33" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">剩余 99%</text>
      <text x="96" y="74" font-size="11" fill="#ffffff" opacity="0.78">本次消耗 ¥0.05 · 充值 ¥86.47</text>
    </g>

    <!-- session section -->
    <g transform="translate(14, 144)">
      <text x="0" y="8" font-size="11" fill="#94a3b8">本次会话</text>
      <rect x="0" y="16" width="288" height="30" rx="10" fill="#f8fafc"/>
      <text x="10" y="36" font-size="13" font-weight="600" fill="#0f172a">¥12.5396</text>
      <text x="238" y="36" font-size="11" fill="#94a3b8">1.3M tokens</text>
      <rect x="0" y="52" width="70" height="18" rx="9" fill="#ffffff" stroke="#e2e8f0"/>
      <circle cx="12" cy="61" r="3.5" fill="#4d6bfe"/>
      <text x="20" y="65" font-size="10" fill="#334155">输入 937K</text>
      <rect x="76" y="52" width="78" height="18" rx="9" fill="#ffffff" stroke="#e2e8f0"/>
      <circle cx="88" cy="61" r="3.5" fill="#a78bfa"/>
      <text x="96" y="65" font-size="10" fill="#334155">缓存读 30.0M</text>
      <rect x="160" y="52" width="72" height="18" rx="9" fill="#ffffff" stroke="#e2e8f0"/>
      <circle cx="172" cy="61" r="3.5" fill="#34d399"/>
      <text x="180" y="65" font-size="10" fill="#334155">输出 179K</text>
    </g>

    <!-- total section -->
    <g transform="translate(14, 196)">
      <rect x="0" y="0" width="288" height="24" rx="10" fill="#f8fafc"/>
      <text x="10" y="16" font-size="11" fill="#94a3b8">累计花费</text>
      <text x="232" y="16" font-size="12" font-weight="600" fill="#0f172a">¥12.5396 · 1 个会话</text>
    </g>

    <!-- note -->
    <text x="14" y="230" font-size="10" fill="#94a3b8">按 DeepSeek 官方价估算 · 价格可在 profile 配置中调整</text>
  </g>
</svg>
